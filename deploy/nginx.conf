# Shanzhai static origin vhost.
# Only reachable via Cloudflare Tunnel (cloudflared) — bind to loopback.
# Cloudflare's Worker route /api/subscriptions/* is matched before this origin,
# so subscription traffic never reaches Nginx.
#
# Install: sudo cp deploy/nginx.conf /etc/nginx/sites-available/shanzhai
#          sudo ln -s /etc/nginx/sites-available/shanzhai /etc/nginx/sites-enabled/
#          sudo nginx -t && sudo systemctl reload nginx

server {
    listen 127.0.0.1:8088;
    server_name shanzhai.shaojiang61.site;

    root /home/shaojiang61/web/findspike/public;
    index index.html;

    access_log /var/log/nginx/shanzhai.access.log;
    error_log /var/log/nginx/shanzhai.error.log warn;

    # Rebuilt site swaps in atomically; keep freshness headers short.
    location / {
        try_files $uri $uri/ /index.html;
        add_header X-Content-Type-Options nosniff;
        add_header X-Frame-Options DENY;
        add_header Referrer-Policy no-referrer;
    }

    location = /index.html { add_header Cache-Control "no-cache"; }
    location = /status.json { add_header Cache-Control "no-cache"; }
    location /data/ {
        add_header Cache-Control "no-cache";
    }

    # Block anything not part of the static site.
    location ~ /\. {
        deny all;
    }
}
